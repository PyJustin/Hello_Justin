name: Build Pygame Zero APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Pre-bundle Pygame Zero
      run: |
        # Download pure python pgzero directly into source directory
        pip install pgzero --target . --no-deps

    - name: Build APK with Buildozer Docker
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        buildozer_version: stable
        command: buildozer android debug
        repository_root: .

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pygame-zero-apk
        path: bin/*.apk
      if: always()

