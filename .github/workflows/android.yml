name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer Dependencies
      run: |
        sudo apt-get update
            - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --fix-broken \
          libunwind-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          <PACKAGE_FROM_LINE_2> \
          <PACKAGE_FROM_LINE_3> \
          <PACKAGE_FROM_LINE_4>



    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install Cython==0.29.33 buildozer

    - name: Build APK with Buildozer
      run: |
        # This tells Buildozer to accept the Android SDK licenses automatically
        yes | buildozer android debug
      env:
        # Ensures buildozer uses the right openjdk installed by apt
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: game-apk
        path: bin/*.apk

