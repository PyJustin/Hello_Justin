name: Build Pygame Zero APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          git \
          ffmpeg \
          libssl-dev \
          libffi-dev \
          libsqlite3-dev \
          sqlite3 \
          bzip2 \
          libbz2-dev \
          zlib1g-dev \
          openssl \
          unzip \
          zip \
          autoconf \
          libtool \
          pkg-config \
          cmake \
          libstdc++6 \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip setuptools wheel packaging
        pip install Cython==0.29.36 buildozer python-for-android        

    - name: Pre-bundle Pygame Zero
      run: |
        # Pre-bundle pure python pgzero directly into your project files
        pip install pgzero --target . --no-deps

    - name: Build APK with Buildozer
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        rm -rf .buildozer/
        rm -rf bin/
        yes | buildozer android debug
      env:
        ACCEPT_SDK_LICENSE: "y"

    - name: Locate APK
      run: find /home/runner/work -name "*.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: hello-justin-apk
        path: "**/*.apk"
        include-hidden-files: true
